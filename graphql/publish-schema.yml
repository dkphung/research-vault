# Publish GraphQL Schema to Router Repository
# This workflow automatically publishes the comments schema to the cosmo router repo
# whenever the schema file changes.

name: Publish GraphQL Schema

on:
  push:
    branches: [main, trunk]
    paths:
      - 'src/graphql/**/*.graphql'
  workflow_dispatch:

env:
  SUBGRAPH_NAME: comments
  ROUTER_REPO: little/cosmo-gateway  # Change to your GitHub username/org
  SCHEMA_FILE: src/graphql/comments.schema.graphql

jobs:
  publish-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout subgraph repo
        uses: actions/checkout@v4

      - name: Validate schema file exists
        run: |
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "❌ Schema file not found: $SCHEMA_FILE"
            exit 1
          fi
          echo "✅ Schema file found"
          echo "Schema preview:"
          head -20 "$SCHEMA_FILE"

      - name: Publish to router repository
        env:
          GITHUB_TOKEN: ${{ secrets.ROUTER_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing $SUBGRAPH_NAME schema to $ROUTER_REPO"

          # Clone router repo
          git clone "https://${GITHUB_TOKEN}@github.com/${ROUTER_REPO}.git" /tmp/router
          cd /tmp/router

          # Ensure schemas directory exists
          mkdir -p schemas

          # Copy schema file
          cp "$GITHUB_WORKSPACE/$SCHEMA_FILE" "schemas/${SUBGRAPH_NAME}.graphql"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit if changed
          git add "schemas/${SUBGRAPH_NAME}.graphql"

          if git diff --staged --quiet; then
            echo "No schema changes detected"
          else
            git commit -m "Update ${SUBGRAPH_NAME} schema

Published from: ${{ github.repository }}@${{ github.sha }}
Triggered by: ${{ github.event.head_commit.message }}

🤖 Generated with Claude Code"
            git push
            echo "✅ Schema published successfully"
          fi

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Schema Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** $SUBGRAPH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Router Repo:** $ROUTER_REPO" >> $GITHUB_STEP_SUMMARY
          echo "- **Schema File:** $SCHEMA_FILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
